<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0c0c0c; color: #f5f0e8; font-family: Georgia, serif; }
  </style>
</head>
<body class="p-8">
  {% if p.imagen_url %}
    <img src="{{ p.imagen_url }}" alt="" class="w-full h-48 object-cover rounded-xl mb-6">
  {% endif %}
  <p class="uppercase tracking-[0.3em] text-[#c9a962] text-xs mb-3">Blog Marnez</p>
  <h1 class="text-3xl mb-4">{{ p.titulo }}</h1>
  <p class="text-white/50 text-sm mb-6">{{ p.resumen }}</p>
  {% set fs = {'sm': 'text-base', 'base': 'text-lg', 'lg': 'text-xl', 'xl': 'text-2xl'}[p.font_size] if p.font_size else 'text-lg' %}
  <p class="{{ fs }} text-white/80 leading-relaxed whitespace-pre-line">{{ p.cuerpo }}</p>
</body>
</html>
