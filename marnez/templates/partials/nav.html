{% set hero_endpoints = ['main.index', 'main.desarrollo_detalle', 'main.nosotros', 'main.blog_post', 'carreras.index'] %}
{% set on_hero_page = request.endpoint in hero_endpoints %}
<header x-data="{ open: false, scrolled: false, isLight: document.documentElement.classList.contains('light') }"
  x-init="window.addEventListener('scroll', () => scrolled = window.scrollY > 20)"
  :class="scrolled ? 'liquid-glass text-cream' : 'bg-transparent border-transparent {{ 'text-white' if on_hero_page else 'text-cream' }}'"
  class="fixed top-0 inset-x-0 z-50 border-b transition-[background,border-color] duration-500">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-20 flex items-center justify-between">
    <a href="{{ url_for('main.index') }}" class="flex items-center gap-3 shrink-0">
      <img src="{{ diseno.logo_oscuro }}"
        x-show="{{ 'true' if on_hero_page else 'false' }} && !scrolled || !isLight" x-cloak
        alt="Marnez Desarrollos" class="h-9 w-auto">
      <img src="{{ diseno.logo_claro }}"
        x-show="!({{ 'true' if on_hero_page else 'false' }} && !scrolled) && isLight" x-cloak
        alt="Marnez Desarrollos" class="h-9 w-auto">
    </a>

    <nav class="hidden lg:flex items-center gap-8 text-sm font-medium tracking-wide">
      <a href="{{ url_for('main.index') }}" class="hover:text-gold transition-colors {{ 'text-gold' if request.endpoint == 'main.index' }}">Inicio</a>
      <a href="{{ url_for('main.desarrollos') }}" class="hover:text-gold transition-colors {{ 'text-gold' if request.endpoint and request.endpoint.startswith('main.desarrollo') }}">Desarrollos</a>
      <a href="{{ url_for('main.nosotros') }}" class="hover:text-gold transition-colors {{ 'text-gold' if request.endpoint == 'main.nosotros' }}">Nosotros</a>
      <a href="{{ url_for('main.blog') }}" class="hover:text-gold transition-colors {{ 'text-gold' if request.endpoint and request.endpoint.startswith('main.blog') }}">Blog</a>
      <a href="{{ url_for('carreras.index') }}" class="hover:text-gold transition-colors {{ 'text-gold' if request.blueprint == 'carreras' }}">Únete a Nosotros</a>
      <a href="{{ url_for('main.contacto') }}" class="ml-2 inline-flex items-center rounded-full border border-gold px-5 py-2 text-gold hover:bg-gold hover:text-ink transition-colors">Contacto</a>

      <button type="button" @click="isLight = !isLight; window.marnezSetTheme(isLight)" class="theme-toggle" aria-label="Cambiar entre modo claro y oscuro">
        <span class="theme-toggle-thumb">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 1.42 1.42-1.42M5.64 18.36l-1.42 1.42m15.56-1.42 1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>
        </span>
      </button>
    </nav>

    <div class="flex items-center gap-3 lg:hidden">
      <button type="button" @click="isLight = !isLight; window.marnezSetTheme(isLight)" class="theme-toggle" aria-label="Cambiar entre modo claro y oscuro">
        <span class="theme-toggle-thumb">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 1.42 1.42-1.42M5.64 18.36l-1.42 1.42m15.56-1.42 1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>
        </span>
      </button>
      <button @click="open = !open" class="p-2" aria-label="Abrir menú">
        <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="open" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div x-show="open" x-cloak @click.outside="open = false" x-transition
    class="liquid-glass lg:hidden px-5 py-6 flex flex-col gap-5 text-lg font-display">
    <a href="{{ url_for('main.index') }}" class="hover:text-gold">Inicio</a>
    <a href="{{ url_for('main.desarrollos') }}" class="hover:text-gold">Desarrollos</a>
    <a href="{{ url_for('main.nosotros') }}" class="hover:text-gold">Nosotros</a>
    <a href="{{ url_for('main.blog') }}" class="hover:text-gold">Blog</a>
    <a href="{{ url_for('carreras.index') }}" class="hover:text-gold">Únete a Nosotros</a>
    <a href="{{ url_for('main.contacto') }}" class="hover:text-gold">Contacto</a>
  </div>
</header>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
